apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: espera-eureka                # só este — o gateway não fala com o config-server
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eureka-server 9080; do sleep 2; done']
      containers:
        - name: gateway
          image: gateway:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:9080/eureka/"
          readinessProbe:
            tcpSocket: { port: 9081 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ecommerce
spec:
  selector:
    app: gateway
  ports:
    - port: 9081
      targetPort: 9081