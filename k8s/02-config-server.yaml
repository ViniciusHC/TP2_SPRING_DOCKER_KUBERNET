apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9999
          env:                                # variáveis de ambiente do container
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:9080/eureka/"
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "true"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "true"
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
              value: "file:///config-repo"       # mantido por compatibilidade; o profile native usa search-locations
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS
              value: "file:///config-repo"
          volumeMounts:                        # onde o volume abaixo aparece dentro do container
            - name: config-repo
              mountPath: /config-repo             # o ConfigMap "vira" arquivos nesta pasta
          readinessProbe:
            tcpSocket: { port: 9999 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:                                 # declara de onde vem o volume citado acima
        - name: config-repo
          configMap:
            name: config-repo                     # precisa bater com o nome criado no Passo 08
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: ecommerce
spec:
  selector:
    app: config-server
  ports:
    - port: 9999
      targetPort: 9999