apiVersion: v1
kind: ConfigMap
metadata:
  name: config-repo
  namespace: ecommerce
data:
  product-service.properties: |
    spring.application.name=product-service
    server.port=9082
    eureka.client.serviceUrl.defaultZone=http://eureka-server:9080/eureka/
    spring.datasource.url=jdbc:h2:mem:produtoDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    spring.datasource.driverClassName=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=
    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console
    spring.jpa.defer-datasource-initialization=true
    spring.jpa.hibernate.ddl-auto=create-drop
    spring.jpa.show-sql=true
  restaurante-service.properties: |
    spring.application.name=restaurante-service
    server.port=9083
    eureka.client.serviceUrl.defaultZone=http://eureka-server:9080/eureka/